name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify committed lib/ is up to date
        run: |
          if ! git diff --exit-code --quiet -- lib/; then
            echo "::error::lib/ is out of date — run 'npm run build' and commit the result"
            git diff --stat -- lib/
            exit 1
          fi
          echo "lib/ is up to date"
